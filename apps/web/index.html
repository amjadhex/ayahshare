<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script id="theme-boot">
  // The appearance the person chose (Settings: System · Light · Dark; src/theme.ts, prefs.ts "qd.theme") is on <html> before the
  // CSS, so the first paint is already the right theme. System = no attribute.
  (function () {
    try {
      var v = JSON.parse(localStorage.getItem("qd.theme"));
      if (v === "light" || v === "dark") document.documentElement.dataset.theme = v;
    } catch (e) {}
  })();
</script>
<title>AyahShare</title>
<meta name="description" content="An ayah for every moment. Create beautiful Quran images and videos to share.">
<!-- Link previews for the site itself; a share link's page (/s/:code) replaces these with its own (apps/api shares.ts).
     The app's screens point search engines to /app; / is the landing page (public/landing.html). -->
<link rel="canonical" href="https://ayahshare.com/app">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AyahShare">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:title" content="AyahShare">
<meta name="twitter:description" content="An ayah for every moment. Create beautiful Quran images and videos to share.">
<meta name="twitter:image" content="https://ayahshare.com/og.png">
<meta name="apple-mobile-web-app-title" content="AyahShare">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f0e" media="(prefers-color-scheme: dark)">
<script>
  // A link straight to a dark screen (the editor; Reels on a phone) is dark from the first paint: the page colour and the
  // theme colour (ui/App.tsx setPageTone keeps them after), so no white band shows under the status bar or toolbar.
  (function () {
    var p = location.pathname, phone = matchMedia("(max-width: 759px)").matches;
    var tone = (/^\/create\/?$/.test(p) || /^\/s\/[\w-]+/.test(p) || /[?&]r=/.test(location.search)) ? "editor" : phone && /^\/(feed|reels)\/?$/.test(p) ? "black" : "";
    if (!tone) return;
    document.documentElement.dataset.page = tone;
    var c = tone === "black" ? "#000000" : "#0b0f0e";
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.dataset.html = m.content; m.content = c; });
  })();
</script>

<link rel="preload" as="image" href="/brand/lockup-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">

<!-- The splash in #root: the mark on the app's own background until the app draws its first screen (React replaces it). -->
<style>
  .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
  .boot-ink { fill: #0f5c4d; stroke: #0f5c4d; }
  /* The system's theme, unless the person chose one (data-theme): both come before the dark screens' page colours. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boot { background: #0b0f0e; } :root:not([data-theme="light"]) .boot-ink { fill: #e3b25e; stroke: #e3b25e; } }
  :root[data-theme="dark"] .boot { background: #0b0f0e; }
  :root[data-theme="dark"] .boot-ink { fill: #e3b25e; stroke: #e3b25e; }
  :root[data-page="black"] .boot { background: #000; }
  :root[data-page="editor"] .boot { background: #0b0f0e; }
  .boot svg { animation: boot-in 0.5s ease-out both; }
  @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } }
  @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
</style>
